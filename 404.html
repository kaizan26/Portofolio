<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>404 — Halaman Tidak Ditemukan | Bobby Kamal Aizan</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon-192.svg">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #08090f;
      --surface: rgba(20, 22, 34, 0.85);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f5f5f7;
      --muted: #a1a1ad;
      --accent: #2997ff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f6;
        --surface: rgba(255, 255, 255, 0.9);
        --border: rgba(0, 0, 0, 0.1);
        --text: #1d1d1f;
        --muted: #4c4c52;
        --accent: #0066cc;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 480px;
      width: 100%;
      padding: 36px 32px;
      border-radius: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 24px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      border-radius: 9999px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Tautan yang Anda tuju tidak tersedia atau telah dipindahkan. Silakan kembali ke halaman utama portofolio Bobby Kamal Aizan.</p>
    <a href="/">Kembali ke Beranda</a>
  </main>
</body>
</html>
